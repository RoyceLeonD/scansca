services:
  # PostgreSQL database for testing
  postgres-test:
    image: postgres:13
    environment:
      POSTGRES_DB: scansca_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./sql_migrations:/docker-entrypoint-initdb.d
      - ./test_data/postgresql:/test_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d scansca_test"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - scansca_test_network
    restart: on-failure

  # MySQL database for testing (when implemented)
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: scansca_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./test_data/mysql:/test_data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "test_user", "-ptest_password"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - scansca_test_network
    # Don't start by default - only when needed
    profiles: ["mysql"]

networks:
  scansca_test_network:
    name: scansca_test_network

volumes:
  postgres_test_data:
    driver: local
  mysql_test_data:
    driver: local