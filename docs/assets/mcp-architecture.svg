<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="320" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="320" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Antska MCP Architecture</text>

  <!-- LLM Client Box -->
  <rect x="50" y="70" width="160" height="80" fill="#6495ED" rx="5" ry="5" opacity="0.8"/>
  <text x="130" y="110" font-family="Arial" font-size="16" fill="white" text-anchor="middle">LLM Client</text>
  <text x="130" y="130" font-family="Arial" font-size="12" fill="white" text-anchor="middle">(Claude, GPT, etc.)</text>

  <!-- Antska MCP Server Box -->
  <rect x="240" y="70" width="160" height="180" fill="#3CB371" rx="5" ry="5" opacity="0.8"/>
  <text x="320" y="100" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Antska</text>
  <text x="320" y="120" font-family="Arial" font-size="14" fill="white" text-anchor="middle">MCP Server</text>
  
  <!-- Connector Details -->
  <rect x="260" y="140" width="120" height="25" fill="#f8f9fa" rx="3" ry="3" opacity="0.9"/>
  <text x="320" y="157" font-family="Arial" font-size="12" text-anchor="middle">SSE Streaming</text>
  
  <rect x="260" y="175" width="120" height="25" fill="#f8f9fa" rx="3" ry="3" opacity="0.9"/>
  <text x="320" y="192" font-family="Arial" font-size="12" text-anchor="middle">Tool Registry</text>
  
  <rect x="260" y="210" width="120" height="25" fill="#f8f9fa" rx="3" ry="3" opacity="0.9"/>
  <text x="320" y="227" font-family="Arial" font-size="12" text-anchor="middle">DB Connectors</text>

  <!-- Database Box -->
  <rect x="430" y="70" width="160" height="80" fill="#FF7F50" rx="5" ry="5" opacity="0.8"/>
  <text x="510" y="105" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Databases</text>
  <text x="510" y="125" font-family="Arial" font-size="12" fill="white" text-anchor="middle">(PostgreSQL, etc.)</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  
  <!-- LLM to Antska -->
  <line x1="210" y1="110" x2="240" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="100" font-family="Arial" font-size="10">HTTP</text>
  
  <!-- Antska to LLM -->
  <line x1="240" y1="130" x2="210" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="145" font-family="Arial" font-size="10">SSE</text>
  
  <!-- Antska to DB -->
  <line x1="400" y1="110" x2="430" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="415" y="100" font-family="Arial" font-size="10">Query</text>
  
  <!-- DB to Antska -->
  <line x1="430" y1="130" x2="400" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="415" y="145" font-family="Arial" font-size="10">Results</text>
  
  <!-- Legend -->
  <rect x="50" y="260" width="540" height="40" fill="white" rx="5" ry="5" stroke="#ddd"/>
  <text x="60" y="282" font-family="Arial" font-size="12" font-weight="bold">Key Features:</text>
  <text x="150" y="282" font-family="Arial" font-size="12">• Model Context Protocol (MCP) compliant</text>
  <text x="370" y="282" font-family="Arial" font-size="12">• Real-time data streaming with SSE</text>
</svg>